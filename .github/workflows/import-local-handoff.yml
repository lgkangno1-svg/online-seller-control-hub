name: Import SellerHub Verified Transfer

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-local-handoff.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TRANSFER_BASE: https://gave-isbn-targeted-nest.trycloudflare.com
      EXPECTED_SHA256: cba0fcad86f566cae728776202652479addf0e498a77752253a6f6e719b45fec
      EXPECTED_SOURCE: da2fb1791fcd8ad68656f3a33374a9b9960d8dd5
    steps:
      - name: Checkout destination
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: true

      - name: Download and verify sanitized bundle
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 5 --retry-all-errors --connect-timeout 10 \
            "$TRANSFER_BASE/bundle.tar.gz" -o "$RUNNER_TEMP/sellerhub-handoff.tar.gz"
          actual="$(sha256sum "$RUNNER_TEMP/sellerhub-handoff.tar.gz" | awk '{print $1}')"
          [[ "$actual" == "$EXPECTED_SHA256" ]]
          source_sha="$(curl --fail --silent --show-error "$TRANSFER_BASE/SOURCE" | tr -d '\r\n')"
          [[ "$source_sha" == "$EXPECTED_SOURCE" ]]
          echo "verified_sha256=$actual"
          echo "verified_source=$source_sha"

      - name: Extract and validate standalone tree
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/sellerhub-import"
          mkdir -p "$RUNNER_TEMP/sellerhub-import"
          tar -xzf "$RUNNER_TEMP/sellerhub-handoff.tar.gz" -C "$RUNNER_TEMP/sellerhub-import"
          test -s "$RUNNER_TEMP/sellerhub-import/package.json"
          test -s "$RUNNER_TEMP/sellerhub-import/web/package.json"
          test -s "$RUNNER_TEMP/sellerhub-import/src/index.ts"
          test -s "$RUNNER_TEMP/sellerhub-import/.github/workflows/ci.yml"
          test ! -e "$RUNNER_TEMP/sellerhub-import/config/admin-bootstrap.enc"
          test ! -e "$RUNNER_TEMP/sellerhub-import/.env"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'

      - name: Verify backend
        working-directory: ${{ runner.temp }}/sellerhub-import
        run: |
          npm install --no-audit --no-fund
          npm run typecheck
          npm test

      - name: Verify frontend production build
        working-directory: ${{ runner.temp }}/sellerhub-import/web
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Replace repository with verified standalone tree
        shell: bash
        run: |
          set -euo pipefail
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a "$RUNNER_TEMP/sellerhub-import/." .
          rm -rf .sellerhub-import .sellerhub-transfer || true
          rm -f config/admin-bootstrap.enc .env || true
          rm -f .github/workflows/import-local-handoff.yml .github/workflows/import-sellerhub.yml .github/workflows/handoff-probe.yml || true
          git config user.name 'sellerhub-migration-bot'
          git config user.email 'sellerhub-migration-bot@users.noreply.github.com'
          git add -A
          git commit -m "chore: import verified standalone SellerHub from $EXPECTED_SOURCE"
          git push origin HEAD:main
