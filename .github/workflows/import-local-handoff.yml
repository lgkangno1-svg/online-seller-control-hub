name: Import SellerHub Local Handoff

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-local-handoff.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: self-hosted
    timeout-minutes: 30
    steps:
      - name: Checkout destination
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: true

      - name: Verify local handoff bundle
        shell: bash
        run: |
          set -euo pipefail
          test -s /tmp/sellerhub-handoff.tar.gz
          test -s /tmp/sellerhub-handoff.sha256
          test -s /tmp/sellerhub-handoff.source
          expected="$(cat /tmp/sellerhub-handoff.sha256)"
          actual="$(sha256sum /tmp/sellerhub-handoff.tar.gz | awk '{print $1}')"
          [[ "$actual" == "$expected" ]]
          echo "source=$(cat /tmp/sellerhub-handoff.source)"
          echo "sha256=$actual"

      - name: Extract and validate standalone tree
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/sellerhub-import"
          mkdir -p "$RUNNER_TEMP/sellerhub-import"
          tar -xzf /tmp/sellerhub-handoff.tar.gz -C "$RUNNER_TEMP/sellerhub-import"
          test -s "$RUNNER_TEMP/sellerhub-import/package.json"
          test -s "$RUNNER_TEMP/sellerhub-import/web/package.json"
          test -s "$RUNNER_TEMP/sellerhub-import/src/index.ts"
          test -s "$RUNNER_TEMP/sellerhub-import/.github/workflows/ci.yml"
          test ! -e "$RUNNER_TEMP/sellerhub-import/config/admin-bootstrap.enc"
          test ! -e "$RUNNER_TEMP/sellerhub-import/.env"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'

      - name: Verify backend
        working-directory: ${{ runner.temp }}/sellerhub-import
        run: |
          npm install --no-audit --no-fund
          npm run typecheck
          npm test

      - name: Verify frontend production build
        working-directory: ${{ runner.temp }}/sellerhub-import/web
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Replace repository with verified standalone tree
        shell: bash
        run: |
          set -euo pipefail
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a "$RUNNER_TEMP/sellerhub-import/." .
          rm -rf .sellerhub-import .sellerhub-transfer || true
          rm -f config/admin-bootstrap.enc .env || true
          rm -f .github/workflows/import-local-handoff.yml .github/workflows/import-sellerhub.yml .github/workflows/handoff-probe.yml || true
          git config user.name 'sellerhub-migration-bot'
          git config user.email 'sellerhub-migration-bot@users.noreply.github.com'
          git add -A
          git commit -m "chore: import verified standalone SellerHub from $(cat /tmp/sellerhub-handoff.source)"
          git push origin HEAD:main

      - name: Clear handoff files
        if: always()
        shell: bash
        run: rm -f /tmp/sellerhub-handoff.tar.gz /tmp/sellerhub-handoff.sha256 /tmp/sellerhub-handoff.source
