name: Import SellerHub Standalone

on:
  workflow_dispatch:
    inputs:
      bundle_url:
        description: Temporary signed URL for the source bundle
        required: true
        type: string
      expected_sha256:
        description: Expected SHA-256 of the source bundle
        required: true
        type: string

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout destination repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Download and verify source bundle
        env:
          BUNDLE_URL: ${{ inputs.bundle_url }}
          EXPECTED_SHA256: ${{ inputs.expected_sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$BUNDLE_URL"
          test -n "$EXPECTED_SHA256"
          curl --fail --location --silent --show-error "$BUNDLE_URL" -o "$RUNNER_TEMP/sellerhub.tar.gz"
          echo "$EXPECTED_SHA256  $RUNNER_TEMP/sellerhub.tar.gz" | sha256sum --check -
          mkdir -p "$RUNNER_TEMP/sellerhub"
          tar -xzf "$RUNNER_TEMP/sellerhub.tar.gz" -C "$RUNNER_TEMP/sellerhub"
          test -s "$RUNNER_TEMP/sellerhub/package.json"
          test -s "$RUNNER_TEMP/sellerhub/web/package.json"
          test -s "$RUNNER_TEMP/sellerhub/src/index.ts"
          test ! -e "$RUNNER_TEMP/sellerhub/config/admin-bootstrap.enc"

      - name: Replace repository application tree
        shell: bash
        run: |
          set -euo pipefail
          find . -mindepth 1 -maxdepth 1 ! -name '.git' ! -name '.github' -exec rm -rf {} +
          shopt -s dotglob nullglob
          for entry in "$RUNNER_TEMP"/sellerhub/*; do
            [[ "$(basename "$entry")" == '.github' ]] && continue
            cp -a "$entry" .
          done
          rm -rf .sellerhub-import MIGRATION_NOTES.md MIGRATION_PROBE*.txt .migration-probe MIGRATION_TEST_README.md || true
          rm -f config/admin-bootstrap.enc

      - name: Commit imported application
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'sellerhub-migration-bot'
          git config user.email 'sellerhub-migration-bot@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No application changes to import.'
            exit 0
          fi
          git commit -m 'chore: import standalone SellerHub application'
          git push origin HEAD:main
