services:
  sellerhub:
    build:
      context: .
    image: sellerhub:local
    restart: unless-stopped
    env_file:
      - ${SELLERHUB_ENV_FILE:-.env.production}
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      - ${SELLERHUB_DATA_DIR:-./data}:/app/data
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          node -e "fetch('http://127.0.0.1:8787/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
